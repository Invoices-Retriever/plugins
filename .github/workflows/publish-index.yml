name: Publish the plugin index

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "schema/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-index
  cancel-in-progress: false

jobs:
  publish:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Is the application repository readable from here?
        id: app
        env:
          # The default token only reaches this repository. That is enough
          # while the application repository is public; if it is ever made
          # private, set an APP_REPO_TOKEN secret with read access to it, or
          # this job skips itself rather than failing every pull request.
          GH_TOKEN: ${{ secrets.APP_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if gh api repos/Invoices-Retriever/mac-os-app >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Cannot read Invoices-Retriever/mac-os-app, so the authoritative validator did not run. The fast structural checks still did."
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Select the newest Swift toolchain on the runner
        if: steps.app.outputs.available == 'true'
        run: |
          # Runner images ship several Xcodes and default to an older one;
          # this package needs Swift 6. Picking the highest present avoids
          # pinning a version that the image will drop in six months.
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          swift --version

      - name: Check out the application
        if: steps.app.outputs.available == 'true'
        uses: actions/checkout@v4
        with:
          repository: Invoices-Retriever/mac-os-app
          token: ${{ secrets.APP_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          path: .app

      - name: Cache the Swift build
        if: steps.app.outputs.available == 'true'
        uses: actions/cache@v4
        with:
          path: .app/.build
          key: swift-${{ runner.os }}-${{ hashFiles('.app/Package.swift', '.app/Sources/IRCore/**') }}
          restore-keys: swift-${{ runner.os }}-

      - name: Build irctl
        if: steps.app.outputs.available == 'true'
        working-directory: .app
        run: swift build -c release --product irctl

      - name: Build and sign the index
        if: steps.app.outputs.available == 'true'
        env:
          # Ed25519 private key, base64. Generated with `irctl keygen`; the
          # matching public key is compiled into the application, so an index
          # signed with anything else is refused by every installed copy.
          INDEX_SIGNING_KEY: ${{ secrets.INDEX_SIGNING_KEY }}
        run: |
          if [ -z "$INDEX_SIGNING_KEY" ]; then
            # Deliberately a skip rather than a failure: an unsigned index is
            # refused by every installed copy of the application, so publishing
            # one would be worse than publishing nothing. Generate a key pair
            # with `irctl keygen` and set the secret to start publishing.
            echo "::warning::INDEX_SIGNING_KEY is not set — nothing published."
            echo "skipped=true" >> "$GITHUB_ENV"
            exit 0
          fi
          IRCTL="$(cd .app && swift build -c release --show-bin-path)/irctl"
          printf '%s' "$INDEX_SIGNING_KEY" > /tmp/signing.key
          trap 'rm -f /tmp/signing.key' EXIT

          # An empty index is a legitimate state, not a failure: it is what the
          # catalogue looks like before the first plugin has been verified
          # against a live account. Publishing it signed means the application
          # can already fetch, verify and install nothing — which is the whole
          # pipeline working.
          if compgen -G "plugins/*.json" > /dev/null; then
            "$IRCTL" validate plugins
          else
            echo "::notice::plugins/ holds no verified plugins yet; publishing an empty signed index."
          fi

          "$IRCTL" index plugins --key /tmp/signing.key --out dist --revision "${{ github.run_number }}"
          mkdir -p dist/plugins
          cp -R plugins/. dist/plugins/

      - name: Verify what we are about to publish
        if: steps.app.outputs.available == 'true' && env.skipped != 'true'
        run: |
          test -s dist/index.json
          test -s dist/index.json.sig
          python3 - <<'PY'
          import json, hashlib, pathlib, sys
          index = json.loads(pathlib.Path("dist/index.json").read_text())
          bad = 0
          for item in index["plugins"]:
              data = pathlib.Path("dist") / item["path"]
              digest = hashlib.sha256(data.read_bytes()).hexdigest()
              if digest != item["sha256"]:
                  print(f"::error::checksum mismatch for {item['id']}")
                  bad += 1
          print(f"{len(index['plugins'])} plugin(s), revision {index['revision']}")
          sys.exit(1 if bad else 0)
          PY

      - name: Publish
        if: steps.app.outputs.available == 'true' && env.skipped != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      # Served at https://invoices-retriever.github.io/plugins/index.json.
      # Pages rather than raw.githubusercontent: Pages purges its CDN when a
      # deploy lands, and raw does not — it served a five-minute-old index
      # twice during development, which looked like a bug in the application
      # both times. An index that has to be able to withdraw a compromised
      # plugin cannot be eventually consistent.
